# Canonical label set for every avalon-initiative repository.
# Synced via the reusable label-sync workflow (.github/workflows/label-sync.yml)
# in this repo — edit here, not by hand on individual repos.
#
# Format matches EndBug/label-sync: https://github.com/EndBug/label-sync

- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working as intended"

- name: "type: feature"
  color: "a2eeef"
  description: "New capability or functionality"

- name: "type: chore"
  color: "cfd3d7"
  description: "Maintenance, tooling, or non-user-facing work"

- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"

- name: "decision"
  color: "5319e7"
  description: "A decision still being decided — open means deciding"

- name: "architecture-decision-record"
  color: "5319e7"
  description: "A closed, recorded architectural decision (ADR)"

- name: "priority: high"
  color: "b60205"
  description: ""

- name: "priority: medium"
  color: "fbca04"
  description: ""

- name: "priority: low"
  color: "0e8a16"
  description: ""

- name: "status: blocked"
  color: "e11d21"
  description: "Waiting on something external before work can continue"

- name: "status: in progress"
  color: "fef2c0"
  description: ""

- name: "status: needs review"
  color: "c2e0c6"
  description: ""

- name: "claimed"
  color: "006b75"
  description: "Someone has claimed this issue via /claim — see the claim-check workflow"

- name: "stale"
  color: "ededed"
  description: "No activity for a while — will auto-close if it stays quiet"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"
