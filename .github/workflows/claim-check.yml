name: Claim check (reusable)

on:
  workflow_call:

jobs:
  claim:
    if: github.event.issue != null && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment.body || '').trim().toLowerCase();
            if (body !== '/claim') return;

            const issue = context.payload.issue;
            const commenter = context.payload.comment.user.login;

            if (issue.assignees.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `@${commenter} this issue is already claimed by @${issue.assignees[0].login}.`,
              });
              return;
            }

            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: issue.number,
              assignees: [commenter],
            });
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: ['claimed'],
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: `@${commenter} you've claimed this issue.`,
            });
