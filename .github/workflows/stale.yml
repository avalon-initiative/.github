name: Stale check (reusable)

on:
  workflow_call:
    inputs:
      days-before-stale:
        type: number
        default: 30
      days-before-close:
        type: number
        default: 7

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "status: blocked,decision,pinned"
          exempt-pr-labels: "status: blocked"
          stale-issue-message: >
            This issue has been inactive for ${{ inputs.days-before-stale }} days
            and will be closed in ${{ inputs.days-before-close }} days if there's
            no further activity.
          stale-pr-message: >
            This pull request has been inactive for ${{ inputs.days-before-stale }}
            days and will be closed in ${{ inputs.days-before-close }} days if
            there's no further activity.
